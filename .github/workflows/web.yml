name: Web installer checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned component revision
        id: component
        run: echo "revision=$(python3 -c 'import json; print(json.load(open("component-pin.json"))["revision"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: zomco/mmwave-component
          ref: ${{ steps.component.outputs.revision }}
          path: .component
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: static/package-lock.json
      - run: python3 scripts/check_contract.py
      - run: python3 -m unittest discover -s tests -v
      - run: sudo apt-get update && sudo apt-get install -y g++
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - working-directory: static
        env:
          MWCP_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          MWCP_CI_SANDBOX_FALLBACK: '1'
          MWCP_GPP: g++
        run: |
          npm ci
          npm run test:unit
          npm run test:browser
          npm run build
